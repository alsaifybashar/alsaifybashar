name: git-profile-koi

on:
  schedule:
    - cron: "20 0 * * *" # Daily, just after midnight UTC
  workflow_dispatch: # Run manually from the Actions tab
  push:
    paths: [.github/workflows/git-koi.yml]

permissions:
  contents: write # Lets the workflow commit the GIF

concurrency: koi

jobs:
  generate-koi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate git-profile-koi
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          body: white # white, black, asagi, tea, gold, or platinum
          output-dir: koi

      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
